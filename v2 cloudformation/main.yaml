AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Stack raiz de la app de asistencia (iac-asistencia).
  Orquesta stacks anidados: red, security groups, NACLs y servidores EC2.
  Desplegar con "aws cloudformation package" + "deploy" (ver README.md).

Parameters:
  ProjectName:
    Type: String
    Default: iac-asistencia
    Description: Prefijo para los nombres y etiquetas de los recursos

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: Bloque CIDR de la VPC

  PublicSubnetCidr:
    Type: String
    Default: 10.0.1.0/24
    Description: Bloque CIDR de la Subred Publica (Servidor Frontend)

  PrivateSubnetCidr:
    Type: String
    Default: 10.0.2.0/24
    Description: Bloque CIDR de la Subred Aislada (Servidor Backend)

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t2.micro
    Description: Tipo de instancia EC2 (Free Tier)

  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id
    Description: AMI de Ubuntu 22.04 LTS resuelta automaticamente por region (apta para Free Tier)

  KeyName:
    Type: String
    Default: ""
    Description: Nombre opcional del Key Pair de EC2 para SSH (dejar vacio si no se usa)

  AdminSshIp:
    Type: String
    Default: ""
    Description: IP publica del administrador para SSH de emergencia directo al backend (CIDR, ej. 190.10.20.30/32). Vacio = solo acceso via Frontend (Bastion)

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyName, ""]]

Resources:

  # TemplateURL con ruta local: "aws cloudformation package" la sube a S3
  # y la reemplaza por la URL final antes del despliegue.

  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./network.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        VpcCidr: !Ref VpcCidr
        PublicSubnetCidr: !Ref PublicSubnetCidr
        PrivateSubnetCidr: !Ref PrivateSubnetCidr

  SecurityGroupsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./security-groups.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        AdminSshIp: !Ref AdminSshIp

  NaclsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./nacls.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        FrontendSubnetId: !GetAtt NetworkStack.Outputs.FrontendSubnetId
        BackendSubnetId: !GetAtt NetworkStack.Outputs.BackendSubnetId
        PublicSubnetCidr: !Ref PublicSubnetCidr
        AdminSshIp: !Ref AdminSshIp

  FrontendServerStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: NetworkStack
    Properties:
      TemplateURL: ./ec2-server.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        ServerRole: frontend
        Tier: Frontend
        ImageId: !Ref ImageId
        InstanceType: !Ref InstanceType
        KeyName: !Ref KeyName
        SubnetId: !GetAtt NetworkStack.Outputs.FrontendSubnetId
        SecurityGroupId: !GetAtt SecurityGroupsStack.Outputs.FrontendSecurityGroupId

  BackendServerStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: NetworkStack
    Properties:
      TemplateURL: ./ec2-server.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        ServerRole: backend
        Tier: Backend-Restricted
        ImageId: !Ref ImageId
        InstanceType: !Ref InstanceType
        KeyName: !Ref KeyName
        SubnetId: !GetAtt NetworkStack.Outputs.BackendSubnetId
        SecurityGroupId: !GetAtt SecurityGroupsStack.Outputs.BackendSecurityGroupId

Outputs:
  FrontendPublicIp:
    Description: Direccion IP publica del Servidor Frontend (cambia al detener y encender la instancia)
    Value: !GetAtt FrontendServerStack.Outputs.PublicIp

  FrontendPrivateIp:
    Description: Direccion IP privada del Servidor Frontend dentro de la VPC
    Value: !GetAtt FrontendServerStack.Outputs.PrivateIp

  BackendPrivateIp:
    Description: IP privada del Servidor Backend - usar esta IP en la configuracion de Nginx
    Value: !GetAtt BackendServerStack.Outputs.PrivateIp

  BackendPublicIp:
    Description: IP publica de salida del Backend (el trafico entrante esta bloqueado por el Security Group)
    Value: !GetAtt BackendServerStack.Outputs.PublicIp

  FrontendWebUrl:
    Description: URL publica para abrir el frontend en el navegador (revisar tras cada reinicio)
    Value: !Sub "http://${FrontendServerStack.Outputs.PublicIp}"

  SshConnectFrontend:
    Condition: HasKeyName
    Description: Comando para conectar por SSH al servidor Frontend
    Value: !Sub "ssh -i <tu-clave.pem> ubuntu@${FrontendServerStack.Outputs.PublicIp}"

  SshConnectBackendBastion:
    Condition: HasKeyName
    Description: Comando para conectar por SSH al Backend usando el Frontend como salto (Bastion)
    Value: !Sub "ssh -i <tu-clave.pem> -J ubuntu@${FrontendServerStack.Outputs.PublicIp} ubuntu@${BackendServerStack.Outputs.PrivateIp}"
